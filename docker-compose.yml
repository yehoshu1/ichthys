services:
  ixoye:
    build: .
    container_name: ixoye-app
    restart: always
    ports:
      - "4000:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/ixoye.db
