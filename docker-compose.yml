services:
  postgres:
    image: postgres:17
    container_name: ixoye-postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ixoye}
      POSTGRES_USER: ${POSTGRES_USER:-ixoye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixoye}
    volumes:
      - ixoye_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ixoye} -d ${POSTGRES_DB:-ixoye}
      interval: 10s
      timeout: 5s
      retries: 10

  ixoye:
    build: .
    container_name: ixoye-app
    restart: always
    command:
      - pm2-runtime
      - start
      - ecosystem.config.js
    ports:
      - 4002:4002
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4002}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PG_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ixoye}
      POSTGRES_USER: ${POSTGRES_USER:-ixoye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixoye}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ixoye}:${POSTGRES_PASSWORD:-ixoye}@postgres:5432/${POSTGRES_DB:-ixoye}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: ixoye-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ixoye

  # =============================================================================
  # Alternative: Traefik (uncomment below and comment out the Caddy service above)
  # =============================================================================
  # traefik:
  #   image: traefik:v3.0
  #   container_name: ixoye-traefik
  #   restart: always
  #   command:
  #     - --providers.docker=true
  #     - --providers.docker.exposedbydefault=false
  #     - --entrypoints.web.address=:80
  #     - --entrypoints.websecure.address=:443
  #     - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
  #     - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
  #     - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-you@example.com}
  #     - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - traefik_certs:/letsencrypt
  #   networks:
  #     - ixoye-net
  #
  # # Then add these labels to the ixoye service:
  # #   labels:
  # #     - traefik.enable=true
  # #     - traefik.http.routers.ixoye-web.rule=Host(`${DOMAIN:-example.com}`)
  # #     - traefik.http.routers.ixoye-web.entrypoints=web
