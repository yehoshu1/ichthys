  # #     - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
  # #   networks:
  # #     - ichthys-net

  ichthys-pg-backup:
    image: postgres:17
    container_name: ichthys-pg-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ichthys}
      POSTGRES_USER: ${POSTGRES_USER:-ichthys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ichthys}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ichthys}
    volumes:
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        while true; do
          TS=$$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          DUMP_PATH="/backups/ichthys-$${TS}.dump"
          pg_dump \
            --host="$${POSTGRES_HOST}" \
            --port="$${POSTGRES_PORT}" \
            --username="$${POSTGRES_USER}" \
            --format=custom \
            --file="$${DUMP_PATH}" \
            "$${POSTGRES_DB}"

          KEEP="$${BACKUP_RETENTION_COUNT:-10}"
          ls -1t /backups/*.dump 2>/dev/null | awk "NR>$${KEEP}" | xargs -r rm -f

          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done

volumes:
  ichthys_pg_data: null
  caddy_data: null
  caddy_config: null
  # traefik_certs: null
