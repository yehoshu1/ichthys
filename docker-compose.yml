services:
  postgres:
    image: postgres:17
    container_name: ichthys-postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ichthys}
      POSTGRES_USER: ${POSTGRES_USER:-ichthys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ichthys}
    volumes:
      - ichthys_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ichthys} -d ${POSTGRES_DB:-ichthys}
      interval: 10s
      timeout: 5s
      retries: 10

  ichthys:
    build: .
    container_name: ichthys-app
    restart: always
    command:
      - pm2-runtime
      - start
      - ecosystem.config.js
    ports:
      - 4002:4002
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:4002}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY_DEPTH: "1"
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-https://${DOMAIN:-bot.ichthys.qzz.io}}
      PG_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ichthys}
      POSTGRES_USER: ${POSTGRES_USER:-ichthys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ichthys}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ichthys}:${POSTGRES_PASSWORD:-ichthys}@postgres:5432/${POSTGRES_DB:-ichthys}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: ichthys-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ichthys

  # =============================================================================
  # Alternative: Traefik (uncomment below and comment out the Caddy service above)
  # =============================================================================
  # traefik:
  #   image: traefik:v3.0
  #   container_name: ichthys-traefik
  #   restart: always
  #   command:
  #     - --providers.docker=true
  #     - --providers.docker.exposedbydefault=false
  #     - --entrypoints.web.address=:80
  #     - --entrypoints.websecure.address=:443
  #     - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
  #     - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
  #     - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-you@example.com}
  #     - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
  #   ports:
  #     - "80:80"
