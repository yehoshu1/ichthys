name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Guard - Module Guards
        run: npm run guard:modules

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ichthys_ci
          POSTGRES_USER: ichthys
          POSTGRES_PASSWORD: ichthys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ichthys -d ichthys_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bot
        run: npm run build

      - name: Push database schema
        run: npm run db:push
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ichthys_ci
          POSTGRES_USER: ichthys
          POSTGRES_PASSWORD: ichthys
          DATABASE_URL: postgresql://ichthys:ichthys@localhost:5432/ichthys_ci

      - name: Build dashboard
        run: npm run dashboard:build
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ichthys_ci
          POSTGRES_USER: ichthys
          POSTGRES_PASSWORD: ichthys
          DATABASE_URL: postgresql://ichthys:ichthys@localhost:5432/ichthys_ci

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build
